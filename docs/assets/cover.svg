<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Mistral AI integration (illustration). No logo of Mistral AI:
       the name only says which service the integration talks to; this project
       is not affiliated with Mistral AI. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1a2e"/>
      <stop offset="1" stop-color="#2d2440"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.5" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#e63b19"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece7f2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#bg)"/>
  <!-- a soft wind of warm lines (the mistral is a wind) -->
  <g fill="none" stroke="url(#warm)" stroke-linecap="round" opacity="0.9">
    <path d="M-20 455 C 160 420, 300 490, 470 450 S 720 420, 820 440" stroke-width="10"/>
    <path d="M-20 482 C 180 450, 320 512, 500 478 S 740 450, 820 470" stroke-width="6" opacity="0.7"/>
    <path d="M-20 505 C 200 482, 340 530, 520 500 S 760 482, 820 498" stroke-width="3" opacity="0.5"/>
  </g>
  <!-- the house -->
  <g transform="translate(110 50)">
    <path d="M0 110 L110 20 L220 110" fill="none" stroke="#ffd23f" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="28" y="100" width="164" height="130" rx="10" fill="#ffffff" opacity="0.1"/>
    <rect x="28" y="100" width="164" height="130" rx="10" fill="none" stroke="#ffd23f" stroke-width="10"/>
    <rect x="88" y="160" width="44" height="70" rx="6" fill="#ff8a1f"/>
  </g>
  <!-- the chat bubbles -->
  <g transform="translate(380 40)">
    <path d="M0 20 a20 20 0 0 1 20 -20 h260 a20 20 0 0 1 20 20 v66 a20 20 0 0 1 -20 20 h-226 l-30 26 v-26 h-4 a20 20 0 0 1 -20 -20 z" fill="url(#bubble)"/>
    <rect x="28" y="30" width="200" height="14" rx="7" fill="#c9bfd8"/>
    <rect x="28" y="60" width="140" height="14" rx="7" fill="#c9bfd8"/>
    <g transform="translate(60 150)">
      <path d="M0 20 a20 20 0 0 1 20 -20 h240 a20 20 0 0 1 20 20 v66 a20 20 0 0 1 -20 20 h-4 v26 l-30 -26 h-206 a20 20 0 0 1 -20 -20 z" fill="url(#warm)"/>
      <rect x="28" y="30" width="190" height="14" rx="7" fill="#ffffff" opacity="0.85"/>
      <rect x="28" y="60" width="120" height="14" rx="7" fill="#ffffff" opacity="0.85"/>
    </g>
  </g>
  <!-- the title -->
  <text x="400" y="408" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Mistral AI</text>
  <text x="770" y="520" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#d8d0e6">for Gladys Assistant</text>
</svg>
